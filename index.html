<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Telefon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #121212; --card-bg: #1e1e1e; --text-white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding: 0; }
        .safe-area { height: 40px; background: #000; }
        .lang-bar { background: #000; padding: 15px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #333; }
        .lang-bar button { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-bar button.active { background: var(--gold); color: #000; }
        
        header { padding: 20px; text-align: center; }
        header h1 { margin: 0; color: var(--gold); text-transform: uppercase; font-size: 24px; }
        
        /* Marka Bar */
        .brand-bar { display: flex; justify-content: center; gap: 15px; padding: 10px; flex-wrap: wrap; }
        .brand-btn { background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 12px; cursor: pointer; min-width: 60px; text-align: center; }
        .brand-btn.active { border-color: var(--gold); color: var(--gold); }
        .brand-btn i { font-size: 20px; display: block; margin-bottom: 5px; }

        .container { padding: 15px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .swiper { width: 100%; height: 300px; background: #000; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .swiper-pagination-bullet { background: var(--gold) !important; opacity: 0.6; }
        .swiper-pagination-bullet-active { opacity: 1; }
        .info { padding: 20px; text-align: left; }
        .specs { color: #888; font-size: 14px; margin: 5px 0; }
        .price { font-size: 22px; color: var(--gold); font-weight: bold; margin: 15px 0; }
        .buy-btn { display: block; background: var(--gold); color: #000; text-align: center; padding: 15px; text-decoration: none; border-radius: 12px; font-weight: bold; }
        #offline-warning { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="offline-warning"><h1>⚠️</h1><h2 id="off-text">Internet ýok</h2></div>
    <div class="safe-area"></div>
    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">🇹🇲 TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">🇹🇷 TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">🇷🇺 RU</button>
        <button onclick="changeLang('en')" id="btn-en">🇺🇸 EN</button>
    </div>
    
    <header>
        <h1 id="main-title">Kargo Mobile</h1>
        <p id="sub-title" style="color:#888; padding: 10px;">Amatly we Çalt Eltip Bermek</p>
        <p id="welcome-msg" style="color:#f1c40f; font-size: 14px; padding: 0 20px;">Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!</p>
    </header>

    <div class="brand-bar">
        <button class="brand-btn" onclick="filterBy('all', this)"><i>📱</i><span class="b-txt" data-key="all">Ählisi</span></button>
        <button class="brand-btn" onclick="filterBy('iPhone', this)"><i>🍎</i><span>iPhone</span></button>
        <button class="brand-btn" onclick="filterBy('Samsung', this)"><i>🔹</i><span>Samsung</span></button>
        <button class="brand-btn" onclick="filterBy('Infinix', this)"><i>⚡</i><span>Infinix</span></button>
    </div>

    <div class="container" id="product-list">
        <p id="start-msg" style="text-align:center; color:#555; margin-top:50px;">Görmek isleýän modeliňizi ýokardan saýlaň</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let currentLang = 'tm';
        let allProducts = [];
        let selectedBrand = 'none';

        const trans = {
            tm: { sub: "Amatly we Çalt Eltip Bermek", welcome: "Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!", start: "Görmek isleýän modeliňizi ýokardan saýlaň", buy: "Sargyt Et", off: "Internet ýok!", all: "Ählisi" },
            tr: { sub: "Hızlı ve Uygun Teslimat", welcome: "Kargo Mobile Hizmetinizde. Telefonlar uygun fiyatlı ve hızlı teslimat hizmeti bizde!", start: "Görmek istediğiniz modeli yukarıdan seçiniz", buy: "Sipariş Ver", off: "İnternet yok!", all: "Hepsi" },
            ru: { sub: "Быстрая доставка", welcome: "Kargo Mobile к вашим услугам. У нас доступные цены и быстрая доставка телефонов!", start: "Выберите интересующую модель выше", buy: "Заказать", off: "Нет интернета!", all: "Все" },
            en: { sub: "Fast Delivery", welcome: "Kargo Mobile at your service. Affordable prices and fast delivery!", start: "Please select a model above", buy: "Order Now", off: "No Internet!", all: "All" }
        };

        async function loadProducts() {
            try {
                const response = await fetch('products.json?v=' + new Date().getTime());
                allProducts = await response.json();
                // Ilki bilen hiç zat görkezmeýär (selectedBrand = 'none')
            } catch (e) { console.log(e); }
        }

        function filterBy(brand, el) {
            selectedBrand = brand;
            document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            render();
        }

        function render() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            if (selectedBrand === 'none') {
                list.innerHTML = `<p style="text-align:center; color:#555; margin-top:50px;">${trans[currentLang].start}</p>`;
                return;
            }

            const filtered = allProducts.filter(p => {
                if (selectedBrand === 'all') return true;
                return p.name.toLowerCase().includes(selectedBrand.toLowerCase());
            });

            filtered.forEach((p, index) => {
                let slides = p.images.map(img => `<div class="swiper-slide"><img src="./${img}"></div>`).join('');
                list.innerHTML += `
                    <div class="card">
                        <div class="swiper mySwiper-${index}"><div class="swiper-wrapper">${slides}</div><div class="swiper-pagination"></div></div>
                        <div class="info">
                            <h3>${p.name}</h3>
                            <div class="specs">${p.specs}</div>
                            <p class="price">${p.price}</p>
                            <a href="https://wa.me/99364041065" class="buy-btn">${trans[currentLang].buy}</a>
                        </div>
                    </div>`;
            });

            filtered.forEach((p, index) => {
                new Swiper(`.mySwiper-${index}`, { pagination: { el: ".swiper-pagination", clickable: true }, observer: true, observeParents: true });
            });
        }

        function changeLang(l) {
            currentLang = l;
            document.getElementById('sub-title').innerText = trans[l].sub;
            document.getElementById('welcome-msg').innerText = trans[l].welcome;
            document.getElementById('off-text').innerText = trans[l].off;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            document.querySelector('.b-txt').innerText = trans[l].all;
            render();
        }

        window.addEventListener('offline', () => document.getElementById('offline-warning').style.display = 'flex');
        window.addEventListener('online', () => document.getElementById('offline-warning').style.display = 'none');
        loadProducts();
    </script>
</body>
</html>
