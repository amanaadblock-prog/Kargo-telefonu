<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Mobile Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #0c0c0c; --card-bg: #161616; --text-white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding-bottom: 30px; overflow-x: hidden; }

        #offline-overlay { 
            display: none; position: fixed; inset: 0; background: #000; 
            z-index: 10000; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; padding: 20px;
        }
        #offline-overlay i { font-size: 70px; color: var(--gold); margin-bottom: 20px; }

        .lang-bar { 
            padding-top: calc(env(safe-area-inset-top) + 10px);
            background: #000; padding-bottom: 12px; display: flex; 
            justify-content: center; gap: 8px; border-bottom: 1px solid #222;
        }
        .lang-bar button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
        .lang-bar button.active { background: var(--gold); color: #000; font-weight: bold; border-color: var(--gold); }

        header { padding: 15px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 24px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

        .brand-nav { display: flex; justify-content: space-around; padding: 10px 5px; background: #0c0c0c; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 999; }
        .brand-item { text-align: center; cursor: pointer; flex: 1; }
        .brand-item i { font-size: 18px; display: block; margin-bottom: 4px; color: #555; }
        .brand-item span { font-size: 9px; font-weight: bold; color: #555; }
        .brand-item.active i, .brand-item.active span { color: var(--gold); }

        .container { padding: 12px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #222; margin-bottom: 25px; }
        .swiper { width: 100%; height: 320px; background: #000; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .info { padding: 18px; }
        .model-name { font-size: 19px; font-weight: 800; margin-bottom: 5px; }
        .specs { color: #888; font-size: 13px; margin-bottom: 15px; }
        
        /* Iki baha bolanda deň durar ýaly dizaýn */
        .price-section { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #222; pt: 15px; margin-top: 10px; }
        .price-item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; border-radius: 12px; }
        .price-text { display: flex; flex-direction: column; }
        .price-val { font-size: 18px; color: var(--gold); font-weight: 900; }
        .price-tl { font-size: 13px; color: #777; font-weight: 500; }

        .buy-btn-small { 
            background: var(--gold); color: #000; text-decoration: none; 
            padding: 8px 12px; border-radius: 8px; font-weight: 900; font-size: 12px; 
            display: flex; align-items: center; gap: 5px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="offline-overlay">
        <i class="fa-solid fa-wifi"></i>
        <h2 id="off-title">Internet ýok</h2>
        <p id="off-desc">Dowam etmek üçin internete birigiň.</p>
    </div>

    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">RU</button>
        <button onclick="changeLang('en')" id="btn-en">EN</button>
    </div>
    
    <header><h1>Kargo Mobile</h1></header>

    <div class="brand-nav">
        <div class="brand-item active" onclick="setFilter('all', this)"><i class="fa-solid fa-border-all"></i><span id="t-all">Hemmesi</span></div>
        <div class="brand-item" onclick="setFilter('iPhone', this)"><i class="fa-brands fa-apple"></i><span>iPhone</span></div>
        <div class="brand-item" onclick="setFilter('Samsung', this)"><i class="fa-solid fa-mobile-screen"></i><span>Samsung</span></div>
        <div class="brand-item" onclick="setFilter('Infinix', this)"><i class="fa-solid fa-bolt"></i><span>Infinix</span></div>
        <div class="brand-item" onclick="setFilter('Other', this)"><i class="fa-solid fa-ellipsis"></i><span id="t-other">Beýleki</span></div>
    </div>

    <div class="container" id="product-list"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const phoneWA = "99361234567";

        const translations = {
            tm: { all: "Hemmesi", other: "Beýleki", buy: "Sargyt", msg: "Salam, sargyt etmek isleýärin: " },
            tr: { all: "Hepsi", other: "Diğer", buy: "Sipariş", msg: "Merhaba, sipariş vermek istiyorum: " },
            ru: { all: "Все", other: "Прочее", buy: "Заказ", msg: "Здравствуйте, хочу заказать: " },
            en: { all: "All", other: "Other", buy: "Order", msg: "Hello, I want to order: " }
        };

        const products = [
            { name: "iPhone 17 Pro", brand: "iPhone", specs: "256GB | Silver | 1 SIM", prices: [{label: "256GB", val: "1,300$ (59,150 TL)"}], images: ["shopping.webp", "surat2.webp", "surat3.webp", "surat4.webp"] },
            { name: "iPhone 17 Pro Max", brand: "iPhone", specs: "256GB | Blue | 1 SIM", prices: [{label: "256GB", val: "1,405$ (63,927 TL)"}], images: ["max1.jpg", "max2.jpg", "max3.jpg", "max4.jpg"] },
            { name: "Samsung S24", brand: "Samsung", specs: "Black | Täze | Iki görnüşli ýat", 
              prices: [
                  {label: "8/128GB", val: "490$ (22,295 TL)"},
                  {label: "8/256GB", val: "555$ (25,252 TL)"}
              ], images: ["s24_1.jpg", "s24_2.jpg", "s24_3.jpg", "s24_4.jpg"] },
            { name: "Samsung A17", brand: "Samsung", specs: "Täze | Iki görnüşli ýat", 
              prices: [
                  {label: "4/128GB", val: "173$ (7,871 TL)"},
                  {label: "6/128GB", val: "185$ (8,417 TL)"}
              ], images: ["a17_1.jpg", "a17_2.jpg", "a17_3.jpg", "a17_4.jpg"] },
            { name: "Infinix Hot 60i", brand: "Infinix", specs: "Täze | Iki görnüşli ýat", 
              prices: [
                  {label: "4/128GB", val: "132$ (6,006 TL)"},
                  {label: "4/256GB", val: "150$ (6,825 TL)"}
              ], images: ["hot60i_1.jpg", "hot60i_2.jpg", "hot60i_3.jpg", "hot60i_4.jpg"] },
            { name: "Samsung S25 Ultra", brand: "Samsung", specs: "12/256GB | Gray, Blue", prices: [{label: "12/256GB", val: "920$ (41,860 TL)"}], images: ["s25u_1.jpg", "s25u_2.jpg", "s25u_3.jpg", "s25u_4.jpg"] }
        ];

        let currentLang = 'tm';
        let activeFilter = 'all';

        function checkInternet() {
            document.getElementById('offline-overlay').style.display = navigator.onLine ? 'none' : 'flex';
        }
        window.addEventListener('online', checkInternet); window.addEventListener('offline', checkInternet);
        checkInternet();

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.getElementById('t-all').innerText = translations[lang].all;
            document.getElementById('t-other').innerText = translations[lang].other;
            renderProducts(activeFilter);
        }

        function setFilter(brand, el) {
            activeFilter = brand;
            document.querySelectorAll('.brand-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            renderProducts(brand);
        }

        function renderProducts(filter = 'all') {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            const filtered = filter === 'all' ? products : products.filter(p => p.brand === filter);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                let imgs = p.images.map(i => `<div class="swiper-slide"><img src="${i}" onerror="this.parentElement.style.background='#000'; this.style.display='none';"></div>`).join('');
                
                let priceHtml = p.prices.map(pr => {
                    let parts = pr.val.split('(');
                    let usd = parts[0].trim();
                    let tl = parts[1] ? '(' + parts[1] : '';
                    return `
                    <div class="price-item">
                        <div class="price-text">
                            <span style="font-size:11px; color:#888;">${pr.label}</span>
                            <span class="price-val">${usd}</span>
                            <span class="price-tl">${tl}</span>
                        </div>
                        <a href="https://wa.me/${phoneWA}?text=${translations[currentLang].msg}${p.name} (${pr.label}) - ${pr.val}" class="buy-btn-small">
                            <i class="fa-brands fa-whatsapp"></i> ${translations[currentLang].buy}
                        </a>
                    </div>`;
                }).join('');

                card.innerHTML = `
                    <div class="swiper mySwiper"><div class="swiper-wrapper">${imgs}</div><div class="swiper-pagination"></div></div>
                    <div class="info">
                        <div class="model-name">${p.name}</div>
                        <div class="specs">${p.specs}</div>
                        <div class="price-section">${priceHtml}</div>
                    </div>`;
                list.appendChild(card);
            });
            new Swiper(".mySwiper", { pagination: { el: ".swiper-pagination", clickable: true }, observer: true, observeParents: true });
        }
        renderProducts();
    </script>
</body>
</html>
