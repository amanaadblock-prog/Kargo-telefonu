<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #121212; --card-bg: #1e1e1e; --text-white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding: 0; }
        .safe-area { height: 40px; background: #000; }
        
        /* Diller bölümi */
        .lang-bar { background: #000; padding: 15px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #333; }
        .lang-bar button { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-bar button.active { background: var(--gold); color: #000; }
        
        header { padding: 20px; text-align: center; }
        header h1 { margin: 0; color: var(--gold); text-transform: uppercase; font-size: 24px; }
        .welcome-msg { color: #f1c40f; font-size: 14px; padding: 10px 20px; text-align: center; line-height: 1.4; }

        /* Marka düwmeleri */
        .brand-nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 10px; }
        .brand-nav button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 12px; cursor: pointer; min-width: 70px; text-align: center; }
        .brand-nav button.active { border-color: var(--gold); color: var(--gold); }
        .brand-nav i { display: block; font-size: 20px; margin-bottom: 5px; }

        .container { padding: 15px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        
        /* Swiper we Suratlar */
        .swiper { width: 100%; height: 300px; background: #000; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .swiper-pagination-bullet { background: var(--gold) !important; }

        .info { padding: 20px; text-align: left; }
        .price { font-size: 22px; color: var(--gold); font-weight: bold; margin: 15px 0; }
        .buy-btn { display: block; background: var(--gold); color: #000; text-align: center; padding: 15px; text-decoration: none; border-radius: 12px; font-weight: bold; }
        
        #offline-warning { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="offline-warning"><h1>⚠️</h1><h2 id="off-text">Internet ýok</h2></div>
    <div class="safe-area"></div>
    
    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">🇹🇲 TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">🇹🇷 TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">🇷🇺 RU</button>
        <button onclick="changeLang('en')" id="btn-en">🇺🇸 EN</button>
    </div>
    
    <header>
        <h1 id="main-title">Kargo Mobile</h1>
        <p id="welcome-msg">Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!</p>
    </header>

    <div class="brand-nav">
        <button onclick="setFilter('all', this)"><i class="fa-solid fa-list"></i><span id="t-all">Ählisi</span></button>
        <button onclick="setFilter('iPhone', this)"><i class="fa-brands fa-apple"></i><span>iPhone</span></button>
        <button onclick="setFilter('Samsung', this)"><i class="fa-solid fa-mobile-screen"></i><span>Samsung</span></button>
        <button onclick="setFilter('Infinix', this)"><i class="fa-solid fa-bolt"></i><span>Infinix</span></button>
    </div>

    <div class="container" id="product-list">
        <p id="start-msg" style="text-align:center; color:#555; margin-top:50px;">Görmek isleýän modeliňizi ýokardan saýlaň</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let currentLang = 'tm';
        let allProducts = [];
        let activeFilter = 'none';

        const trans = {
            tm: { buy: "Sargyt Et", welcome: "Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!", start: "Görmek isleýän modeliňizi ýokardan saýlaň", all: "Ählisi", off: "Internet ýok!" },
            tr: { buy: "Sipariş Ver", welcome: "Kargo Mobile hizmetinizde. Hızlı ve uygun teslimat!", start: "Model seçmek için yukarıya tıklayın", all: "Hepsi", off: "İnternet yok!" },
            ru: { buy: "Заказать", welcome: "Kargo Mobile к вашим услугам. Быстрая доставка телефонов!", start: "Выберите модель сверху", all: "Все", off: "Нет интернета!" },
            en: { buy: "Order Now", welcome: "Kargo Mobile at your service. Fast delivery!", start: "Select a model above", all: "All", off: "No Internet!" }
        };

        async function loadProducts() {
            try {
                const response = await fetch('products.json?v=' + Date.now());
                allProducts = await response.json();
            } catch (e) { console.error("Data error"); }
        }

        function setFilter(brand, btn) {
            activeFilter = brand;
            document.querySelectorAll('.brand-nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderHTML();
        }

        function renderHTML() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filtered = allProducts.filter(p => activeFilter === 'all' || p.name.toLowerCase().includes(activeFilter.toLowerCase()));

            filtered.forEach((p, index) => {
                const slides = p.images.map(img => `<div class="swiper-slide"><img src="${img}" onerror="this.src='https://via.placeholder.com/300x400?text=Surat+Tapylmady'"></div>`).join('');
                list.innerHTML += `
                    <div class="card">
                        <div class="swiper swiper-${index}"><div class="swiper-wrapper">${slides}</div><div class="swiper-pagination"></div></div>
                        <div class="info">
                            <h3>${p.name}</h3>
                            <div style="color:#888; font-size:14px;">${p.specs}</div>
                            <p class="price">${p.price}</p>
                            <a href="https://wa.me/99364041065" class="buy-btn">${trans[currentLang].buy}</a>
                        </div>
                    </div>`;
            });

            // Swiper-i 200ms garaşdyryp işletmek suratlaryň takyk açylmagy üçin
            setTimeout(() => {
                filtered.forEach((_, index) => {
                    new Swiper(`.swiper-${index}`, {
                        pagination: { el: ".swiper-pagination", clickable: true },
                        observer: true, 
                        observeParents: true
                    });
                });
            }, 200);
        }

        function changeLang(l) {
            currentLang = l;
            document.getElementById('welcome-msg').innerText = trans[l].welcome;
            if(document.getElementById('start-msg')) document.getElementById('start-msg').innerText = trans[l].start;
            document.getElementById('t-all').innerText = trans[l].all;
            document.getElementById('off-text').innerText = trans[l].off;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            if(activeFilter !== 'none') renderHTML();
        }

        loadProducts();
    </script>
</body>
</html>
