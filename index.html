<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kargo Mobile Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #0c0c0c; --card-bg: #161616; --text-white: #ffffff; }
        body { font-family: sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding-bottom: 120px; } /* 120px boşluk reklamanyň aşagynda galmazlyk üçin */

        /* Internet ýok bolsa */
        #offline-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .lang-bar { background: #000; padding: 10px; display: flex; justify-content: center; gap: 8px; border-bottom: 1px solid #222; }
        .lang-bar button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
        .lang-bar button.active { background: var(--gold); color: #000; font-weight: bold; }

        header { padding: 15px; text-align: center; }
        header h1 { margin: 0; font-size: 24px; color: var(--gold); text-transform: uppercase; }

        .brand-nav { display: flex; justify-content: space-around; padding: 10px 5px; background: #0c0c0c; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 999; }
        .brand-item { text-align: center; cursor: pointer; flex: 1; color: #555; }
        .brand-item i { font-size: 18px; display: block; margin-bottom: 4px; }
        .brand-item span { font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .brand-item.active { color: var(--gold); }

        .container { padding: 12px; }
        .card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #222; margin-bottom: 25px; }
        .swiper { width: 100%; height: 300px; background: #000; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .info { padding: 15px; }
        .model-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .specs { color: #888; font-size: 12px; margin-bottom: 15px; }
        
        .price-section { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #222; padding-top: 12px; }
        .price-item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 8px 12px; border-radius: 10px; }
        .price-val { font-size: 16px; color: var(--gold); font-weight: bold; }
        .price-tl { font-size: 11px; color: #777; }

        .buy-btn-small { background: var(--gold); color: #000; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 11px; }

        /* AppsGeyser reklamanyň üstüni ýapmazlygy üçin arka tarapyny arassalamak */
        iframe { display: none !important; } /* Eger mümkin bolsa, reklamany gizle */
    </style>
</head>
<body>
    <div id="offline-overlay"><h2>Internet ýok</h2></div>

    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">RU</button>
        <button onclick="changeLang('en')" id="btn-en">EN</button>
    </div>
    
    <header><h1>Kargo Mobile</h1></header>

    <div class="brand-nav">
        <div class="brand-item active" onclick="setFilter('all', this)"><i class="fa-solid fa-border-all"></i><span>Hemmesi</span></div>
        <div class="brand-item" onclick="setFilter('iPhone', this)"><i class="fa-brands fa-apple"></i><span>iPhone</span></div>
        <div class="brand-item" onclick="setFilter('Samsung', this)"><i class="fa-solid fa-mobile-screen"></i><span>Samsung</span></div>
        <div class="brand-item" onclick="setFilter('Infinix', this)"><i class="fa-solid fa-bolt"></i><span>Infinix</span></div>
        <div class="brand-item" onclick="setFilter('Redmi', this)"><i class="fa-solid fa-mobile"></i><span>Redmi</span></div>
    </div>

    <div class="container" id="product-list"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const phoneWA = "99361234567";
        const translations = {
            tm: { buy: "Sargyt", msg: "Salam, sargyt: " },
            tr: { buy: "Sipariş", msg: "Merhaba, sipariş: " },
            ru: { buy: "Заказ", msg: "Здравствуйте, заказ: " },
            en: { buy: "Order", msg: "Hello, order: " }
        };

        const products = [
            // iPhone
            { name: "iPhone 17 Pro Max", brand: "iPhone", specs: "256GB | Blue", prices: [{label: "256GB", val: "1,405$ (63,927 TL)"}], images: ["max1.jpg", "max2.jpg", "max3.jpg", "max4.jpg"] },
            { name: "iPhone 17 Pro", brand: "iPhone", specs: "256GB | Silver", prices: [{label: "256GB", val: "1,300$ (59,150 TL)"}], images: ["shopping.webp", "surat2.webp", "surat3.webp", "surat4.webp"] },
            { name: "iPhone 17 Pro Orange", brand: "iPhone", specs: "256GB | Orange", prices: [{label: "256GB", val: "1,300$ (59,150 TL)"}], images: ["orange1.jpg", "orange2.jpg", "orange3.jpg", "orange4.jpg"] },
            
            // Samsung
            { name: "Samsung S25 Ultra", brand: "Samsung", specs: "12/256GB", prices: [{label: "12/256GB", val: "920$ (41,860 TL)"}], images: ["s25u_1.jpg", "s25u_2.jpg", "s25u_3.jpg", "s25u_4.jpg"] },
            { name: "Samsung S24", brand: "Samsung", specs: "Black | Täze", prices: [{label: "8/128GB", val: "490$ (22,295 TL)"}, {label: "8/256GB", val: "555$ (25,252 TL)"}], images: ["s24_1.jpg", "s24_2.jpg", "s24_3.jpg", "s24_4.jpg"] },
            { name: "Samsung A36", brand: "Samsung", specs: "8/128GB | Täze", prices: [{label: "8/128GB", val: "260$ (11,830 TL)"}], images: ["a36_1.jpg", "a36_2.jpg", "a36_3.jpg", "a36_4.jpg"] },
            { name: "Samsung A26", brand: "Samsung", specs: "6/128GB | Täze", prices: [{label: "6/128GB", val: "215$ (9,782 TL)"}], images: ["a26_1.jpg", "a26_2.jpg", "a26_3.jpg", "a26_4.jpg"] },
            { name: "Samsung A17", brand: "Samsung", specs: "Täze Model", prices: [{label: "4/128GB", val: "173$ (7,871 TL)"}, {label: "6/128GB", val: "185$ (8,417 TL)"}], images: ["a17_1.jpg", "a17_2.jpg", "a17_3.jpg", "a17_4.jpg"] },
            { name: "Samsung A16", brand: "Samsung", specs: "8/256GB", prices: [{label: "8/256GB", val: "200$ (9,100 TL)"}], images: ["a16_1.jpg", "a16_2.jpg", "a16_3.jpg", "a16_4.jpg"] },
            { name: "Samsung A07", brand: "Samsung", specs: "4/64GB", prices: [{label: "4/64GB", val: "162$ (7,371 TL)"}], images: ["a07_1.jpg", "a07_2.jpg", "a07_3.jpg", "a07_4.jpg"] },

            // Infinix
            { name: "Infinix Zero Flip", brand: "Infinix", specs: "16/512GB", prices: [{label: "16/512GB", val: "440$ (20,020 TL)"}], images: ["zf_1.jpg", "zf_2.jpg", "zf_3.jpg", "zf_4.jpg"] },
            { name: "Infinix GT 30 Pro", brand: "Infinix", specs: "12/256GB", prices: [{label: "12/256GB", val: "325$ (14,787 TL)"}], images: ["gt30_1.jpg", "gt30_2.jpg", "gt30_3.jpg", "gt30_4.jpg"] },
            { name: "Infinix Note 50 Pro", brand: "Infinix", specs: "12/256GB", prices: [{label: "12/256GB", val: "265$ (12,058 TL)"}], images: ["n50p_1.jpg", "n50p_2.jpg", "n50p_3.jpg", "n50p_4.jpg"] },
            { name: "Infinix Hot 60i", brand: "Infinix", specs: "Täze Model", prices: [{label: "4/128GB", val: "132$ (6,006 TL)"}, {label: "4/256GB", val: "150$ (6,825 TL)"}], images: ["h60_1.jpg", "h60_2.jpg", "h60_3.jpg", "h60_4.jpg"] },

            // Redmi
            { name: "Redmi Note 15 Pro", brand: "Redmi", specs: "8/256GB", prices: [{label: "8/256GB", val: "280$ (12,740 TL)"}], images: ["r15p_1.jpg", "r15p_2.jpg", "r15p_3.jpg", "r15p_4.jpg"] },
            { name: "Redmi Note 15", brand: "Redmi", specs: "8/256GB", prices: [{label: "8/256GB", val: "225$ (10,237 TL)"}], images: ["r15_1.jpg", "r15_2.jpg", "r15_3.jpg", "r15_4.jpg"] }
        ];

        let currentLang = 'tm'; let activeFilter = 'all';
        function checkInternet() { document.getElementById('offline-overlay').style.display = navigator.onLine ? 'none' : 'flex'; }
        window.addEventListener('online', checkInternet); window.addEventListener('offline', checkInternet);
        checkInternet();

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            renderProducts(activeFilter);
        }

        function setFilter(brand, el) {
            activeFilter = brand;
            document.querySelectorAll('.brand-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            renderProducts(brand);
        }

        function renderProducts(filter = 'all') {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            const filtered = filter === 'all' ? products : products.filter(p => p.brand === filter);
            filtered.forEach(p => {
                const card = document.createElement('div'); card.className = 'card';
                let imgs = p.images.map(i => `<div class="swiper-slide"><img src="${i}" onerror="this.parentElement.style.background='#000'; this.style.display='none';"></div>`).join('');
                let priceHtml = p.prices.map(pr => {
                    let parts = pr.val.split('(');
                    return `<div class="price-item"><div class="price-text"><span style="font-size:10px; color:#aaa;">${pr.label}</span><span class="price-val">${parts[0].trim()}</span><span class="price-tl">(${parts[1]}</span></div>
                    <a href="https://wa.me/${phoneWA}?text=${translations[currentLang].msg}${p.name} (${pr.label}) - ${pr.val}" class="buy-btn-small">${translations[currentLang].buy}</a></div>`;
                }).join('');
                card.innerHTML = `<div class="swiper mySwiper"><div class="swiper-wrapper">${imgs}</div><div class="swiper-pagination"></div></div><div class="info"><div class="model-name">${p.name}</div><div class="specs">${p.specs}</div><div class="price-section">${priceHtml}</div></div>`;
                list.appendChild(card);
            });
            new Swiper(".mySwiper", { pagination: { el: ".swiper-pagination", clickable: true }, observer: true, observeParents: true });
        }
        renderProducts();
    </script>
</body>
</html>
