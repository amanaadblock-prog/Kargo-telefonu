<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Mobile Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #0f0f0f; --card-bg: #1a1a1a; --text-white: #ffffff; }
        
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding-bottom: 30px; }

        /* INTERNET KESILSE EKRANY ÝAPÝAN BÖLÜM */
        #offline-overlay { 
            display: none; position: fixed; inset: 0; background: #000; 
            z-index: 99999; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; padding: 20px;
        }
        #offline-overlay i { font-size: 80px; color: var(--gold); margin-bottom: 20px; }

        /* DILLER BÖLÜMI */
        .lang-bar { 
            background: #000; padding: 12px; display: flex; justify-content: center; 
            gap: 8px; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000;
        }
        .lang-bar button { 
            background: #222; border: 1px solid #444; color: #fff; padding: 8px 12px; 
            border-radius: 10px; cursor: pointer; font-size: 13px; transition: 0.3s;
        }
        .lang-bar button.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }

        header { padding: 25px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 28px; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

        /* BREND ICONLAR */
        .brand-nav { display: flex; overflow-x: auto; gap: 15px; padding: 15px 20px; scrollbar-width: none; }
        .brand-nav::-webkit-scrollbar { display: none; }
        .brand-item { 
            flex: 0 0 auto; text-align: center; background: #1a1a1a; padding: 12px 18px; 
            border-radius: 15px; border: 1px solid #333; min-width: 70px; cursor: pointer;
        }
        .brand-item i { font-size: 22px; display: block; margin-bottom: 5px; color: #777; }
        .brand-item.active { border-color: var(--gold); background: #222; }
        .brand-item.active i { color: var(--gold); }
        .brand-item span { font-size: 11px; font-weight: bold; color: #888; }

        .container { padding: 15px; }
        .card { background: var(--card-bg); border-radius: 25px; overflow: hidden; border: 1px solid #222; margin-bottom: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        
        .swiper { width: 100%; height: 320px; background: #000; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .info { padding: 20px; }
        .model-name { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .specs { color: #888; font-size: 13px; margin-bottom: 15px; }
        .price-box { font-size: 22px; color: var(--gold); font-weight: 900; margin-bottom: 20px; }

        .buy-btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--gold); color: #000; text-decoration: none; padding: 16px; 
            border-radius: 15px; font-weight: 900; text-transform: uppercase; font-size: 14px;
        }

        .footer-info { padding: 40px 20px; text-align: center; color: #555; font-size: 13px; }
    </style>
</head>
<body>

    <div id="offline-overlay">
        <i class="fa-solid fa-wifi"></i>
        <h2 id="off-title">Internet ýok</h2>
        <p id="off-desc">Programmany ulanmak üçin internete birigiň.</p>
    </div>

    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">🇹🇲 TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">🇹🇷 TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">🇷🇺 RU</button>
        <button onclick="changeLang('en')" id="btn-en">🇺🇸 EN</button>
    </div>
    
    <header>
        <h1 id="main-title">Kargo Mobile</h1>
    </header>

    <div class="brand-nav">
        <div class="brand-item active" onclick="setFilter('all', this)">
            <i class="fa-solid fa-layer-group"></i><span id="t-all">Ählisi</span>
        </div>
        <div class="brand-item" onclick="setFilter('iPhone', this)">
            <i class="fa-brands fa-apple"></i><span>iPhone</span>
        </div>
        <div class="brand-item" onclick="setFilter('Samsung', this)">
            <i class="fa-solid fa-mobile-screen"></i><span>Samsung</span>
        </div>
        <div class="brand-item" onclick="setFilter('Infinix', this)">
            <i class="fa-solid fa-bolt"></i><span>Infinix</span>
        </div>
    </div>

    <div class="container" id="product-list"></div>

    <div class="footer-info">
        <p id="f-desc">© 2024 Kargo Mobile. Ähli hukuklar goralan.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const phoneWA = "99361234567"; // Öz WhatsApp belgiňiz

        const translations = {
            tm: { all: "Ählisi", buy: "Sargyt et", offT: "Internet ýok", offD: "Programmany ulanmak üçin internete birigiň.", msg: "Salam, men sargyt etmek isleýärin: " },
            tr: { all: "Hepsi", buy: "Sipariş Ver", offT: "İnternet Yok", offD: "Uygulamayı kullanmak için internete bağlanın.", msg: "Merhaba, sipariş vermek istiyorum: " },
            ru: { all: "Все", buy: "Заказать", offT: "Нет интернета", offD: "Подключитесь к интернету для работы.", msg: "Здравствуйте, я хочу заказать: " },
            en: { all: "All", buy: "Order Now", offT: "No Internet", offD: "Please connect to internet to use app.", msg: "Hello, I want to order: " }
        };

        const products = [
            { name: "iPhone 17 Pro Max", brand: "iPhone", specs: "256GB | Blue | 1 SIM | Täze", price: "1,405$ (63,927 TL)", images: ["max1.jpg", "max2.jpg"] },
            { name: "Samsung S25 Ultra", brand: "Samsung", specs: "12/256GB | Gray | Täze", price: "920$ (41,860 TL)", images: ["s25u_1.jpg", "s25u_2.jpg"] },
            { name: "Infinix Zero Flip", brand: "Infinix", specs: "16/512GB | Täze", price: "440$ (20,020 TL)", images: ["zeroflip_1.jpg", "zeroflip_2.jpg"] }
        ];

        let currentLang = 'tm';

        function checkInternet() {
            const overlay = document.getElementById('offline-overlay');
            if (!navigator.onLine) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        window.addEventListener('online', checkInternet);
        window.addEventListener('offline', checkInternet);
        checkInternet();

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            
            document.getElementById('t-all').innerText = translations[lang].all;
            document.getElementById('off-title').innerText = translations[lang].offT;
            document.getElementById('off-desc').innerText = translations[lang].offD;
            
            renderProducts(window.activeFilter || 'all');
        }

        function renderProducts(filter = 'all') {
            window.activeFilter = filter;
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.brand === filter);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let imgs = p.images.map(i => `<div class="swiper-slide"><img src="${i}" onerror="this.src='https://via.placeholder.com/400x400?text=${p.name}'"></div>`).join('');

                card.innerHTML = `
                    <div class="swiper mySwiper"><div class="swiper-wrapper">${imgs}</div><div class="swiper-pagination"></div></div>
                    <div class="info">
                        <div class="model-name">${p.name}</div>
                        <div class="specs">${p.specs}</div>
                        <div class="price-box">${p.price}</div>
                        <a href="https://wa.me/${phoneWA}?text=${translations[currentLang].msg}${p.name} (${p.price})" class="buy-btn">
                            <i class="fa-brands fa-whatsapp"></i> ${translations[currentLang].buy}
                        </a>
                    </div>
                `;
                list.appendChild(card);
            });
            new Swiper(".mySwiper", { pagination: { el: ".swiper-pagination", clickable: true } });
        }

        function setFilter(brand, el) {
            document.querySelectorAll('.brand-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            renderProducts(brand);
        }

        renderProducts();
    </script>
</body>
</html>
