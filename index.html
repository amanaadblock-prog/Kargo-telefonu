<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Telefon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #121212; --card-bg: #1e1e1e; --text-white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding: 0; }
        .safe-area { height: 40px; background: #000; }
        .lang-bar { background: #000; padding: 15px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #333; }
        .lang-bar button { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-bar button.active { background: var(--gold); color: #000; }
        
        header { padding: 25px; text-align: center; }
        header h1 { margin: 0; color: var(--gold); text-transform: uppercase; font-size: 24px; }
        .welcome-msg { color: #f1c40f; font-size: 14px; padding: 0 20px; line-height: 1.5; margin-bottom: 20px; }

        /* Marka Düwmeleri */
        .brand-nav { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 10px; margin-bottom: 20px; }
        .brand-nav button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 15px; cursor: pointer; min-width: 75px; transition: 0.3s; }
        .brand-nav button.active { border-color: var(--gold); background: #222; color: var(--gold); box-shadow: 0 0 10px rgba(241, 196, 15, 0.2); }
        .brand-nav i { font-size: 22px; display: block; margin-bottom: 5px; }

        .container { padding: 15px; min-height: 400px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #333; margin-bottom: 25px; }
        
        /* Suratlar üçin ýörite Swiper stili */
        .swiper { width: 100%; height: 320px; background: #000; display: block; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .swiper-slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .info { padding: 20px; }
        .specs { color: #888; font-size: 14px; margin: 8px 0; }
        .price { font-size: 22px; color: var(--gold); font-weight: bold; margin: 15px 0; }
        .buy-btn { display: block; background: var(--gold); color: #000; text-align: center; padding: 15px; text-decoration: none; border-radius: 12px; font-weight: bold; }
        
        .empty-state { text-align: center; padding: 50px; color: #444; }
        .empty-state i { font-size: 40px; margin-bottom: 15px; }

        #offline-warning { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="offline-warning"><h1>⚠️</h1><h2 id="off-text">Internet ýok</h2></div>
    <div class="safe-area"></div>
    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">🇹🇲 TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">🇹🇷 TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">🇷🇺 RU</button>
        <button onclick="changeLang('en')" id="btn-en">🇺🇸 EN</button>
    </div>
    
    <header>
        <h1 id="main-title">Kargo Mobile</h1>
        <p id="welcome-msg" class="welcome-msg">Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!</p>
    </header>

    <div class="brand-nav">
        <button onclick="setFilter('all', this)"><i class="fa-solid fa-border-all"></i><span class="t-all">Ählisi</span></button>
        <button onclick="setFilter('iPhone', this)"><i class="fa-brands fa-apple"></i><span>iPhone</span></button>
        <button onclick="setFilter('Samsung', this)"><i class="fa-solid fa-mobile-screen-button"></i><span>Samsung</span></button>
        <button onclick="setFilter('Infinix', this)"><i class="fa-solid fa-bolt"></i><span>Infinix</span></button>
    </div>

    <div class="container" id="product-list">
        <div class="empty-state">
            <i class="fa-solid fa-hand-pointer"></i>
            <p id="start-msg">Görmek isleýän modeliňizi ýokardan saýlaň</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let currentLang = 'tm';
        let allProducts = [];
        let activeFilter = 'none';

        const trans = {
            tm: { buy: "Sargyt Et", off: "Internet ýok!", welcome: "Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!", start: "Görmek isleýän modeliňizi ýokardan saýlaň", all: "Ählisi" },
            tr: { buy: "Sipariş Ver", off: "İnternet yok!", welcome: "Kargo Mobile hizmetinizde. Hızlı ve uygun telefonlar!", start: "Model seçmek için yukarıya tıklayın", all: "Hepsi" },
            ru: { buy: "Заказать", off: "Нет интернета!", welcome: "Kargo Mobile к вашим услугам. Быстрая доставка телефонов!", start: "Выберите модель сверху", all: "Все" },
            en: { buy: "Order Now", off: "No Internet!", welcome: "Kargo Mobile at your service. Fast and cheap delivery!", start: "Select a model from above", all: "All" }
        };

        async function loadProducts() {
            try {
                const response = await fetch('products.json?v=' + Date.now());
                allProducts = await response.json();
            } catch (e) { console.error("JSON yuklenmedi"); }
        }

        function setFilter(brand, btn) {
            activeFilter = brand;
            document.querySelectorAll('.brand-nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function render() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            const filtered = allProducts.filter(p => {
                if (activeFilter === 'all') return true;
                return p.name.toLowerCase().includes(activeFilter.toLowerCase());
            });

            filtered.forEach((p, index) => {
                const slides = p.images.map(img => `<div class="swiper-slide"><img src="./${img}" onerror="this.src='https://via.placeholder.com/300x400?text=Surat+Tapylmady'"></div>`).join('');
                
                list.innerHTML += `
                    <div class="card">
                        <div class="swiper mySwiper-${index}">
                            <div class="swiper-wrapper">${slides}</div>
                            <div class="swiper-pagination"></div>
                        </div>
                        <div class="info">
                            <h3>${p.name}</h3>
                            <div class="specs">${p.specs}</div>
                            <p class="price">${p.price}</p>
                            <a href="https://wa.me/99364041065?text=Salam, men ${p.name} sargyt etmek isleýärin." class="buy-btn">${trans[currentLang].buy}</a>
                        </div>
                    </div>`;
            });

            // SURATLARYŇ AÇYLMAGY ÜÇIN IŇ MÖHÜM BÖLEK:
            setTimeout(() => {
                filtered.forEach((_, index) => {
                    new Swiper(`.mySwiper-${index}`, {
                        pagination: { el: ".swiper-pagination", clickable: true },
                        observer: true,
                        observeParents: true,
                        watchOverflow: true,
                        init: true
                    });
                });
            }, 100); // 100ms garaşmak suratlaryň we Swiper-iň dogry birleşmegini üpjün edýär.
        }

        function changeLang(l) {
            currentLang = l;
            document.getElementById('welcome-msg').innerText = trans[l].welcome;
            document.getElementById('off-text').innerText = trans[l].off;
            if(document.getElementById('start-msg')) document.getElementById('start-msg').innerText = trans[l].start;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            document.querySelector('.t-all').innerText = trans[l].all;
            if(activeFilter !== 'none') render();
        }

        window.addEventListener('offline', () => document.getElementById('offline-warning').style.display = 'flex');
        window.addEventListener('online', () => document.getElementById('offline-warning').style.display = 'none');
        loadProducts();
    </script>
</body>
</html>
