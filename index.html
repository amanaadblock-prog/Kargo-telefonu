<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Telefon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #121212; --card-bg: #1e1e1e; --text-white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding: 0; }
        .safe-area { height: 40px; background: #000; }
        .lang-bar { background: #000; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #222; }
        .lang-bar button { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-bar button.active { background: var(--gold); color: #000; }
        
        header { padding: 30px 20px 10px 20px; text-align: center; }
        header h1 { margin: 0; color: var(--gold); text-transform: uppercase; font-size: 28px; letter-spacing: 2px; }
        
        /* Marka Menýusy - Has uly we ortada */
        .brand-section { padding: 20px 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 500px; margin: 0 auto; }
        .brand-btn { background: var(--card-bg); border: 2px solid #333; color: #fff; padding: 15px 10px; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .brand-btn i { font-style: normal; font-size: 30px; margin-bottom: 8px; }
        .brand-btn span { font-size: 12px; font-weight: bold; color: #bbb; }
        .brand-btn.active { border-color: var(--gold); background: #2c2c2c; transform: scale(1.05); }
        .brand-btn.active span { color: var(--gold); }

        .container { padding: 15px; }
        .card { background: var(--card-bg); border-radius: 25px; overflow: hidden; border: 1px solid #333; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .swiper { width: 100%; height: 350px; background: #000; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .swiper-pagination-bullet { background: var(--gold) !important; }
        
        .info { padding: 25px; text-align: left; }
        .info h3 { margin: 0; font-size: 20px; color: var(--gold); }
        .specs { color: #aaa; font-size: 14px; margin: 8px 0; line-height: 1.4; }
        .price { font-size: 24px; color: #fff; font-weight: bold; margin: 15px 0; display: flex; align-items: center; gap: 10px; }
        
        .buy-btn { display: block; background: var(--gold); color: #000; text-align: center; padding: 18px; text-decoration: none; border-radius: 15px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .buy-btn:active { transform: scale(0.95); opacity: 0.8; }
        
        #offline-warning { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="offline-warning"><h1>⚠️</h1><h2 id="off-text">Internet ýok</h2></div>
    <div class="safe-area"></div>
    
    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">🇹🇲 TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">🇹🇷 TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">🇷🇺 RU</button>
        <button onclick="changeLang('en')" id="btn-en">🇺🇸 EN</button>
    </div>

    <header>
        <h1 id="main-title">Kargo Telefon</h1>
        <p id="sub-title" style="color:#888; margin-top: 10px;">Amatly we Çalt Eltip Bermek</p>
    </header>

    <div class="brand-section">
        <div class="brand-btn active" onclick="filterBrand('all', this)"><i>📱</i><span>HEMMESI</span></div>
        <div class="brand-btn" onclick="filterBrand('iPhone', this)"><i>🍎</i><span>IPHONE</span></div>
        <div class="brand-btn" onclick="filterBrand('Samsung', this)"><i>🔹</i><span>SAMSUNG</span></div>
        <div class="brand-btn" onclick="filterBrand('Infinix', this)"><i>⚡</i><span>INFINIX</span></div>
        <div class="brand-btn" onclick="filterBrand('Xiaomi', this)"><i>🧡</i><span>XIAOMI</span></div>
        <div class="brand-btn" onclick="filterBrand('Amatly', this)"><i>💰</i><span>AMATLY</span></div>
    </div>

    <div class="container" id="product-list"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let currentLang = 'tm';
        let currentBrand = 'all';
        let allProducts = [];

        const trans = {
            tm: { sub: "Amatly we Çalt Eltip Bermek", buy: "Sargyt Et", off: "Internet ýok!" },
            tr: { sub: "Hızlı ve Uygun Teslimat", buy: "Sipariş Ver", off: "İnternet yok!" },
            ru: { sub: "Быстрая доставка", buy: "Заказать", off: "Нет интернета!" },
            en: { sub: "Fast Delivery", buy: "Order Now", off: "No Internet!" }
        };

        async function loadProducts() {
            try {
                const response = await fetch('products.json?v=' + new Date().getTime());
                allProducts = await response.json();
                renderProducts();
            } catch (e) { console.log("Harytlar ýüklenmedi: ", e); }
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filtered = allProducts.filter(p => {
                if (currentBrand === 'all') return true;
                // Amatly diýen düwme üçin 200$-dan aşak harytlary süzýäris
                if (currentBrand === 'Amatly') return parseInt(p.price) < 200 || p.name.includes("A07") || p.name.includes("A17");
                return p.name.toLowerCase().includes(currentBrand.toLowerCase());
            });

            filtered.forEach((p, index) => {
                let slides = p.images.map(img => `<div class="swiper-slide"><img src="./${img}" onerror="this.src='https://via.placeholder.com/300?text=Surat+Tapylmady'"></div>`).join('');
                list.innerHTML += `
                    <div class="card">
                        <div class="swiper mySwiper-${index}">
                            <div class="swiper-wrapper">${slides}</div>
                            <div class="swiper-pagination"></div>
                        </div>
                        <div class="info">
                            <h3>${p.name}</h3>
                            <div class="specs">${p.specs}</div>
                            <p class="price">${p.price}</p>
                            <a href="https://wa.me/99364041065?text=Salam, men ${p.name} (${p.specs}) sargyt etmek isleýärin." class="buy-btn">${trans[currentLang].buy}</a>
                        </div>
                    </div>`;
            });

            filtered.forEach((p, index) => {
                new Swiper(`.mySwiper-${index}`, { pagination: { el: ".swiper-pagination", clickable: true }, observer: true, observeParents: true });
            });
        }

        function filterBrand(brand, el) {
            currentBrand = brand;
            document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderProducts();
            // Basylanda harytlaryň başlanýan ýerine awtomatik düşürmek üçin
            window.scrollTo({ top: document.querySelector('.brand-section').offsetTop + 150, behavior: 'smooth' });
        }

        function changeLang(l) {
            currentLang = l;
            document.getElementById('sub-title').innerText = trans[l].sub;
            document.getElementById('off-text').innerText = trans[l].off;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            renderProducts();
        }

        window.addEventListener('offline', () => document.getElementById('offline-warning').style.display = 'flex');
        window.addEventListener('online', () => document.getElementById('offline-warning').style.display = 'none');
        loadProducts();
    </script>
</body>
</html>
