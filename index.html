<!DOCTYPE html>
<html>
<head>
    <title>Meniň Telefon Dükanym</title>

        body { font-family: sans-serif; text-align: center; }

        img { width: 100%; height: auto; }
        .price { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Telefon Dükanymyza Hoş Geldiňiz!</h1>
    
    <div class="product">
        <img src="https://via.placeholder.com/150" alt="iPhone 15">
        <h3>iPhone 15 Pro</h3>
        <p class="price">25,000 TMT</p>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/150" alt="Samsung S24">
        <h3>Samsung S24</h3>
        <p class="price">22,000 TMT</p>
    </div>
</body>
</html>
