<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Telefon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #121212; --card-bg: #1e1e1e; --text-white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding: 0; }
        .safe-area { height: 40px; background: #000; }
        
        /* Diller we Baydaklar */
        .lang-bar { background: #000; padding: 15px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #333; }
        .lang-bar button { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-bar button.active { background: var(--gold); color: #000; }
        
        header { padding: 20px; text-align: center; }
        header h1 { margin: 0; color: var(--gold); text-transform: uppercase; font-size: 24px; }
        
        .container { padding: 15px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .swiper { width: 100%; height: 300px; background: #000; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .swiper-pagination-bullet { background: var(--gold) !important; opacity: 0.6; }
        
        .info { padding: 20px; text-align: left; }
        .specs { color: #888; font-size: 14px; margin: 5px 0; }
        .price { font-size: 22px; color: var(--gold); font-weight: bold; margin: 15px 0; }
        .buy-btn { display: block; background: var(--gold); color: #000; text-align: center; padding: 15px; text-decoration: none; border-radius: 12px; font-weight: bold; }

        /* INTERNET ÝOK BOLSA EKRANY ÝAPÝAN SISTEMA */
        #offline-warning { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 99999; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }
        #offline-warning i { font-size: 80px; color: var(--gold); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="offline-warning">
        <i class="fa-solid fa-wifi"></i>
        <h1 id="off-text" style="color: #fff;">Internet ýok</h1>
        <p style="color: #888;">Programmany ulanmak üçin internete birigiň.</p>
    </div>

    <div class="safe-area"></div>
    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">🇹🇲 TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">🇹🇷 TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">🇷🇺 RU</button>
        <button onclick="changeLang('en')" id="btn-en">🇺🇸 EN</button>
    </div>
    
    <header>
        <h1 id="main-title">Kargo Telefon</h1>
        <p id="sub-title" style="color:#888;">Amatly we Çalt Eltip Bermek</p>
    </header>

    <div class="container" id="product-list"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let currentLang = 'tm';
        const trans = {
            tm: { sub: "Amatly we Çalt Eltip Bermek", buy: "Sargyt Et", off: "Internet ýok!" },
            tr: { sub: "Hızlı ve Uygun Teslimat", buy: "Sipariş Ver", off: "İnternet yok!" },
            ru: { sub: "Быстрая доставка", buy: "Заказать", off: "Нет интернета!" },
            en: { sub: "Fast Delivery", buy: "Order Now", off: "No Internet!" }
        };

        async function loadProducts() {
            try {
                const response = await fetch('products.json?v=' + Date.now());
                const products = await response.json();
                const list = document.getElementById('product-list');
                list.innerHTML = '';
                
                products.forEach((p, index) => {
                    let slides = p.images.map(img => `<div class="swiper-slide"><img src="${img}"></div>`).join('');
                    list.innerHTML += `
                        <div class="card">
                            <div class="swiper mySwiper-${index}">
                                <div class="swiper-wrapper">${slides}</div>
                                <div class="swiper-pagination"></div>
                            </div>
                            <div class="info">
                                <h3>${p.name}</h3>
                                <div class="specs">${p.specs}</div>
                                <p class="price">${p.price}</p>
                                <a href="https://wa.me/99364041065" class="buy-btn">${trans[currentLang].buy}</a>
                            </div>
                        </div>`;
                });

                setTimeout(() => {
                    products.forEach((_, index) => {
                        new Swiper(`.mySwiper-${index}`, {
                            pagination: { el: ".swiper-pagination", clickable: true },
                            observer: true,
                            observeParents: true
                        });
                    });
                }, 300);
            } catch (e) { console.log(e); }
        }

        function changeLang(l) {
            currentLang = l;
            document.getElementById('sub-title').innerText = trans[l].sub;
            document.getElementById('off-text').innerText = trans[l].off;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            
            // Harytlar ýüklenen bolsa knopkalary terjime et
            document.querySelectorAll('.buy-btn').forEach(b => b.innerText = trans[l].buy);
        }

        // INTERNET KONTROLY
        function checkConnectivity() {
            if (!navigator.onLine) {
                document.getElementById('offline-warning').style.display = 'flex';
            } else {
                document.getElementById('offline-warning').style.display = 'none';
            }
        }

        window.addEventListener('offline', checkConnectivity);
        window.addEventListener('online', checkConnectivity);
        
        // Başlangyçda barlag
        checkConnectivity();
        loadProducts();
    </script>
</body>
</html>
