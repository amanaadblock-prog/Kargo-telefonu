<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Telefon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #121212; --card-bg: #1e1e1e; --text-white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding: 0; }
        .safe-area { height: 40px; background: #000; }
        .lang-bar { background: #000; padding: 15px; display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid #333; }
        .lang-bar button { background: #222; border: 1px solid var(--gold); color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .lang-bar button.active { background: var(--gold); color: #000; }
        header { padding: 20px; text-align: center; }
        header h1 { margin: 0; color: var(--gold); text-transform: uppercase; font-size: 24px; }
        
        /* Täze goşulan marka düwmeleri stili */
        .brand-nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 10px; }
        .brand-nav button { background: #222; border: 1px solid #444; color: #fff; padding: 10px 15px; border-radius: 12px; cursor: pointer; font-size: 14px; display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .brand-nav button.active { border-color: var(--gold); color: var(--gold); }
        .brand-nav i { font-size: 20px; margin-bottom: 5px; }

        .container { padding: 15px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .swiper { width: 100%; height: 300px; background: #000; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        .swiper-pagination-bullet { background: var(--gold) !important; opacity: 0.6; }
        .swiper-pagination-bullet-active { opacity: 1; }
        .info { padding: 20px; text-align: left; }
        .specs { color: #888; font-size: 14px; margin: 5px 0; }
        .price { font-size: 22px; color: var(--gold); font-weight: bold; margin: 15px 0; }
        .buy-btn { display: block; background: var(--gold); color: #000; text-align: center; padding: 15px; text-decoration: none; border-radius: 12px; font-weight: bold; }
        #offline-warning { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="offline-warning"><h1>⚠️</h1><h2 id="off-text">Internet ýok</h2></div>
    <div class="safe-area"></div>
    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">🇹🇲 TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">🇹🇷 TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">🇷🇺 RU</button>
        <button onclick="changeLang('en')" id="btn-en">🇺🇸 EN</button>
    </div>
    
    <header>
        <h1 id="main-title">Kargo Telefon</h1>
        <p id="sub-title" style="color:#888;">Amatly we Çalt Eltip Bermek</p>
        <p id="welcome-msg" style="color:#f1c40f; font-size: 14px; padding: 10px 20px; line-height: 1.4;">Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!</p>
    </header>

    <div class="brand-nav">
        <button onclick="setFilter('all', this)"><i class="fa-solid fa-list"></i><span class="t-all">Ählisi</span></button>
        <button onclick="setFilter('iPhone', this)"><i class="fa-brands fa-apple"></i><span>iPhone</span></button>
        <button onclick="setFilter('Samsung', this)"><i class="fa-solid fa-mobile-screen"></i><span>Samsung</span></button>
        <button onclick="setFilter('Infinix', this)"><i class="fa-solid fa-bolt"></i><span>Infinix</span></button>
    </div>

    <div class="container" id="product-list">
        <p id="select-prompt" style="text-align:center; color:#555; margin-top:50px;">Görmek isleýän modeliňizi ýokardan saýlaň</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let currentLang = 'tm';
        let allProducts = [];
        let currentFilter = 'none'; // Başlangyçda hiç zat görkezmeýär

        const trans = {
            tm: { sub: "Amatly we Çalt Eltip Bermek", buy: "Sargyt Et", off: "Internet ýok!", welcome: "Kargo Mobile Siziň hyzmatyňyzda. Telefonlar amatly we çalt getirmek hyzmaty bizde!", prompt: "Görmek isleýän modeliňizi ýokardan saýlaň", all: "Ählisi" },
            tr: { sub: "Hızlı ve Uygun Teslimat", buy: "Sipariş Ver", off: "İnternet yok!", welcome: "Kargo Mobile hizmetinizde. Hızlı teslimat ve uygun fiyatlar!", prompt: "Lütfen yukarıdan bir model seçiniz", all: "Hepsi" },
            ru: { sub: "Быстрая доставка", buy: "Заказать", off: "Нет интернета!", welcome: "Kargo Mobile к вашим услугам. Быстрая доставка по лучшим ценам!", prompt: "Пожалуйста, выберите модель выше", all: "Все" },
            en: { sub: "Fast Delivery", buy: "Order Now", off: "No Internet!", welcome: "Kargo Mobile at your service. Fast delivery and best prices!", prompt: "Please select a model above", all: "All" }
        };

        async function loadProducts() {
            try {
                const response = await fetch('products.json?v=' + new Date().getTime());
                allProducts = await response.json();
                // Ilki bilen harytlary görkezmeýäris
            } catch (e) { console.log("Harytlar ýüklenmedi: ", e); }
        }

        // Täze goşulan filter funksiýasy
        function setFilter(brand, btn) {
            currentFilter = brand;
            document.querySelectorAll('.brand-nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            displayProducts();
        }

        function displayProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            if (currentFilter === 'none') {
                list.innerHTML = `<p style="text-align:center; color:#555; margin-top:50px;">${trans[currentLang].prompt}</p>`;
                return;
            }

            const filtered = allProducts.filter(p => {
                if (currentFilter === 'all') return true;
                return p.name.toLowerCase().includes(currentFilter.toLowerCase());
            });

            filtered.forEach((p, index) => {
                let slides = p.images.map(img => `<div class="swiper-slide"><img src="./${img}" onerror="this.src='https://via.placeholder.com/300?text=Surat+Tapylmady'"></div>`).join('');
                
                list.innerHTML += `
                    <div class="card">
                        <div class="swiper mySwiper-${index}">
                            <div class="swiper-wrapper">${slides}</div>
                            <div class="swiper-pagination"></div>
                        </div>
                        <div class="info">
                            <h3>${p.name}</h3>
                            <div class="specs">${p.specs}</div>
                            <p class="price">${p.price}</p>
                            <a href="https://wa.me/99364041065?text=Salam, men ${p.name} sargyt etmek isleýärin." class="buy-btn">${trans[currentLang].buy}</a>
                        </div>
                    </div>`;
            });

            // Seniň original Swiper kodyň
            filtered.forEach((p, index) => {
                new Swiper(`.mySwiper-${index}`, {
                    pagination: { el: ".swiper-pagination", clickable: true },
                    observer: true,
                    observeParents: true
                });
            });
        }

        function changeLang(l) {
            currentLang = l;
            document.getElementById('sub-title').innerText = trans[l].sub;
            document.getElementById('off-text').innerText = trans[l].off;
            document.getElementById('welcome-msg').innerText = trans[l].welcome;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            document.querySelector('.t-all').innerText = trans[l].all;
            displayProducts();
        }

        window.addEventListener('offline', () => document.getElementById('offline-warning').style.display = 'flex');
        window.addEventListener('online', () => document.getElementById('offline-warning').style.display = 'none');
        loadProducts();
    </script>
</body>
</html>
