<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kargo Mobile Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #f1c40f; --dark-bg: #0c0c0c; --card-bg: #161616; --text-white: #ffffff; }
        
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: var(--text-white); margin: 0; padding-bottom: env(safe-area-inset-bottom); }

        /* Internet Warning */
        #offline-overlay { 
            display: none; position: fixed; inset: 0; background: #000; 
            z-index: 99999; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; padding: 20px;
        }
        #offline-overlay i { font-size: 70px; color: var(--gold); margin-bottom: 20px; }

        /* Dilleri aşak süýşürdik (Kameranyň aşagy) */
        .lang-bar { 
            padding-top: env(safe-area-inset-top); /* iPhone "notch" üçin */
            background: #000; padding-bottom: 10px; display: flex; 
            justify-content: center; gap: 6px; border-bottom: 1px solid #222;
        }
        .lang-bar button { 
            background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 10px; 
            border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .lang-bar button.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }

        header { padding: 15px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 24px; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; }

        /* Brendler Ekrana Sygar ýaly edildi */
        .brand-nav { 
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 5px; background: #0c0c0c; border-bottom: 1px solid #1a1a1a;
        }
        .brand-item { 
            text-align: center; cursor: pointer; transition: 0.3s;
            flex: 1; min-width: 60px;
        }
        .brand-item i { font-size: 20px; display: block; margin-bottom: 4px; color: #555; }
        .brand-item span { font-size: 10px; font-weight: bold; color: #555; text-transform: uppercase; }
        .brand-item.active i { color: var(--gold); }
        .brand-item.active span { color: var(--gold); }

        .container { padding: 12px; }
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #222; margin-bottom: 20px; }
        
        .swiper { width: 100%; height: 300px; background: #000; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        .info { padding: 18px; }
        .model-name { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
        .specs { color: #888; font-size: 12px; margin-bottom: 12px; line-height: 1.4; }
        .price-box { font-size: 20px; color: var(--gold); font-weight: 900; margin-bottom: 15px; }

        .buy-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--gold); color: #000; text-decoration: none; padding: 14px; 
            border-radius: 12px; font-weight: 900; font-size: 14px;
        }

        .footer-space { height: 40px; }
    </style>
</head>
<body>

    <div id="offline-overlay">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h2 id="off-title">Internet ýok</h2>
        <p id="off-desc">Dowam etmek üçin internete birigiň.</p>
    </div>

    <div class="lang-bar">
        <button onclick="changeLang('tm')" id="btn-tm" class="active">TM</button>
        <button onclick="changeLang('tr')" id="btn-tr">TR</button>
        <button onclick="changeLang('ru')" id="btn-ru">RU</button>
        <button onclick="changeLang('en')" id="btn-en">EN</button>
    </div>
    
    <header>
        <h1 id="main-title">Kargo Mobile</h1>
    </header>

    <div class="brand-nav">
        <div class="brand-item active" onclick="setFilter('all', this)">
            <i class="fa-solid fa-border-all"></i><span id="t-all">Hemmesi</span>
        </div>
        <div class="brand-item" onclick="setFilter('iPhone', this)">
            <i class="fa-brands fa-apple"></i><span>iPhone</span>
        </div>
        <div class="brand-item" onclick="setFilter('Samsung', this)">
            <i class="fa-solid fa-mobile-screen"></i><span>Samsung</span>
        </div>
        <div class="brand-item" onclick="setFilter('Infinix', this)">
            <i class="fa-solid fa-bolt"></i><span>Infinix</span>
        </div>
        <div class="brand-item" onclick="setFilter('Tecno/Redmi', this)">
            <i class="fa-solid fa-microchip"></i><span>Beýleki</span>
        </div>
    </div>

    <div class="container" id="product-list"></div>
    <div class="footer-space"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const phoneWA = "99361234567"; // Oz belginiz

        const translations = {
            tm: { all: "Hemmesi", buy: "Sargyt et", offT: "Internet ýok", msg: "Salam, sargyt etmek isleýärin: " },
            tr: { all: "Hepsi", buy: "Sipariş Ver", offT: "İnternet Yok", msg: "Merhaba, sipariş vermek istiyorum: " },
            ru: { all: "Все", buy: "Заказать", offT: "Нет интернета", msg: "Здравствуйте, хочу заказать: " },
            en: { all: "All", buy: "Order", offT: "No Internet", msg: "Hello, I want to order: " }
        };

        // Ähli öňki modelleriňi şu taýyk jemledim
        const products = [
            { name: "iPhone 17 Pro Max", brand: "iPhone", specs: "256GB | Blue | 1 SIM | Täze", price: "1,405$ (63,927 TL)", images: ["max1.jpg", "max2.jpg"] },
            { name: "iPhone 17 Pro", brand: "iPhone", specs: "256GB | Silver | Täze", price: "1,300$ (59,150 TL)", images: ["iphone17_1.jpg"] },
            { name: "Samsung S25 Ultra", brand: "Samsung", specs: "12/256GB | Gray | Täze", price: "920$ (41,860 TL)", images: ["s25u_1.jpg", "s25u_2.jpg"] },
            { name: "Samsung A56", brand: "Samsung", specs: "8/128GB | Täze | Black", price: "313$ (14,241 TL)", images: ["a56_1.jpg"] },
            { name: "Infinix Zero Flip", brand: "Infinix", specs: "16/512GB | Foldable", price: "440$ (20,020 TL)", images: ["zeroflip_1.jpg"] },
            { name: "Infinix Note 50 Pro", brand: "Infinix", specs: "12/256GB | Täze", price: "265$ (12,058 TL)", images: ["n50p_1.jpg"] },
            { name: "Infinix Note 50S", brand: "Infinix", specs: "8/256GB | Grey", price: "260$ (11,830 TL)", images: ["n50s_1.jpg"] },
            { name: "Tecno Camon 40 Pro", brand: "Tecno/Redmi", specs: "8/256GB | Täze", price: "250$ (11,375 TL)", images: ["camon40_1.jpg"] },
            { name: "Redmi Note 15 Pro", brand: "Tecno/Redmi", specs: "8/256GB | Pro", price: "280$ (12,740 TL)", images: ["r15p_1.jpg"] },
            { name: "X Pad 20", brand: "Infinix", specs: "4/128GB | Tablet", price: "175$ (7,963 TL)", images: ["xpad_1.jpg"] }
        ];

        let currentLang = 'tm';

        function checkInternet() {
            const overlay = document.getElementById('offline-overlay');
            if (!navigator.onLine) { overlay.style.display = 'flex'; } 
            else { overlay.style.display = 'none'; }
        }

        window.addEventListener('online', checkInternet);
        window.addEventListener('offline', checkInternet);
        checkInternet();

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.getElementById('t-all').innerText = translations[lang].all;
            document.getElementById('off-title').innerText = translations[lang].offT;
            renderProducts(window.activeFilter || 'all');
        }

        function renderProducts(filter = 'all') {
            window.activeFilter = filter;
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.brand === filter);
            
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                let imgs = p.images.map(i => `<div class="swiper-slide"><img src="${i}" onerror="this.src='https://via.placeholder.com/400x400?text=Kargo+Mobile'"></div>`).join('');

                card.innerHTML = `
                    <div class="swiper mySwiper"><div class="swiper-wrapper">${imgs}</div><div class="swiper-pagination"></div></div>
                    <div class="info">
                        <div class="model-name">${p.name}</div>
                        <div class="specs">${p.specs}</div>
                        <div class="price-box">${p.price}</div>
                        <a href="https://wa.me/${phoneWA}?text=${translations[currentLang].msg}${p.name} (${p.price})" class="buy-btn">
                            <i class="fa-brands fa-whatsapp"></i> ${translations[currentLang].buy}
                        </a>
                    </div>
                `;
                list.appendChild(card);
            });
            new Swiper(".mySwiper", { pagination: { el: ".swiper-pagination", clickable: true } });
        }

        function setFilter(brand, el) {
            document.querySelectorAll('.brand-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            renderProducts(brand);
        }

        renderProducts();
    </script>
</body>
</html>
